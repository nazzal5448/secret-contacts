<style>
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }

        @keyframes progress-fluid {
            0% { left: -40%; width: 30%; }
            50% { left: 20%; width: 60%; }

<script>
        // Subtle mouse move effect for the glow
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            const glow = document.querySelector('.bg-tertiary\\/20');
            if(glow) {
                glow.style.transform = `translate(${x}px, ${y}px) scale(1.5)`;
            }
        });

        // Simulate a transition to main app (Visual only)

<style>
        body {
            background-color: #071327;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .gradient-mesh {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(186, 200, 220, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(149, 212, 179, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .glass-card {
            background: rgba(20, 32, 52, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(215, 226, 255, 0.05);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface antialiased">
<div class="gradient-mesh"></div>
<!-- Top AppBar (Simplified for Onboarding) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">Secret Contacts</span>
</div>
<button class="text-label-sm font-label-sm text-on-surface-variant hover:text-on-surface transition-colors px-4 py-2">
            Skip
        </button>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-16 pb-32">
<!-- Illustration Area -->
<div class="relative w-full max-w-sm aspect-square mb-xl flex items-center justify-center">
<!-- Background Glow -->
<div class="absolute inset-0 bg-tertiary/10 blur-[80px] rounded-full scale-75"></div>
<!-- Premium Privacy Illustration -->
<div class="relative z-10 w-full h-full flex items-center justify-center">
<div class="glass-card w-64 h-64 rounded-[48px] flex items-center justify-center shadow-2xl floating">
<div class="absolute -top-4 -right-4 w-20 h-20 bg-tertiary rounded-3xl flex items-center justify-center shadow-lg transform rotate-12">
<span class="material-symbols-outlined text-on-tertiary text-4xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="space-y-4 w-full px-8">
<div class="h-3 w-3/4 bg-on-surface-variant/20 rounded-full"></div>
<div class="h-3 w-1/2 bg-on-surface-variant/20 rounded-full"></div>
<div class="h-3 w-2/3 bg-on-surface-variant/20 rounded-full"></div>
</div>
</div>
<!-- Floating Accents -->
<div class="absolute bottom-8 -left-4 w-16 h-16 glass-card rounded-2xl flex items-center justify-center shadow-xl transform -rotate-6">
<span class="material-symbols-outlined text-primary text-2xl">fingerprint</span>
</div>
<div class="absolute top-12 -right-2 w-12 h-12 glass-card rounded-full flex items-center justify-center shadow-xl">
<span class="material-symbols-outlined text-tertiary text-xl">verified_user</span>
</div>
</div>
</div>
<!-- Content Area -->
<div class="text-center max-w-xs mx-auto">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-md text-on-surface tracking-tight">
                Keep personal contacts private.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80">
                Your high-security vault for sensitive connections. Encrypted, hidden, and only accessible by you.
            </p>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 w-full p-margin-mobile flex flex-col gap-md bg-surface/40 backdrop-blur-md">
<!-- Progress Indicator -->
<div class="flex justify-center gap-2 mb-2">
<div class="w-8 h-1.5 rounded-full bg-primary"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-1.5 rounded-full bg-surface-container-highest"></div>
</div>
<div class="flex items-center gap-md">
<button class="flex-grow h-14 rounded-xl bg-tertiary text-on-tertiary font-title-md text-title-md flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-[0_8px_24px_rgba(149,212,179,0.2)]">
                Next
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Safe Area Padding for mobile -->
<div class="h-safe-area-inset-bottom"></div>
</footer>
<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Subtle parallax mouse effect for the illustration
        document.addEventListener('mousemove', (e) => {
            const amount = 10;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            const illustration = document.querySelector('.floating');
            if (illustration) {
                illustration.style.transform = `translate(${x}px, ${y}px)`;
            }
        });
    </script>
</body></html>

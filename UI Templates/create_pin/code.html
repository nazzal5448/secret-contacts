<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(7, 19, 39, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .pin-dot {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pin-dot.active {
            background-color: #95d4b3; /* tertiary/emerald */
            transform: scale(1.2);
            box-shadow: 0 0 12px rgba(149, 212, 179, 0.5);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }
        /* Custom Toggle Style */
        .toggle-dot {
            transition: transform 0.3s ease;
        }
        input:checked ~ .toggle-bg {
            background-color: #95d4b3;
        }
        input:checked ~ .toggle-dot {
            transform: translateX(100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface flex flex-col min-h-screen overflow-hidden selection:bg-tertiary/30">
<!-- Top App Bar (Suppressing standard nav for focused PIN task) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/10 shadow-sm">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shield</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">Secret Contacts</h1>
</div>
</header>
<!-- Main Content: PIN Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-12 px-margin-mobile">
<!-- Header Info -->
<div class="text-center mb-xl">
<div class="w-16 h-16 bg-surface-container-highest rounded-full flex items-center justify-center mx-auto mb-md border border-outline-variant/20 shadow-lg">
<span class="material-symbols-outlined text-tertiary text-4xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Set your secure PIN</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">Create a 4-digit code to protect your encrypted vault.</p>
</div>
<!-- PIN Indicators -->
<div class="flex gap-lg mb-xl" id="pin-indicator-container">
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
<div class="pin-dot w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent"></div>
</div>
<!-- Keypad Grid -->
<div class="grid grid-cols-3 gap-md w-full max-w-xs">
<!-- Numbers 1-9 -->
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('1')">
<span class="text-2xl font-semibold">1</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('2')">
<span class="text-2xl font-semibold">2</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('3')">
<span class="text-2xl font-semibold">3</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('4')">
<span class="text-2xl font-semibold">4</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('5')">
<span class="text-2xl font-semibold">5</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('6')">
<span class="text-2xl font-semibold">6</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('7')">
<span class="text-2xl font-semibold">7</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('8')">
<span class="text-2xl font-semibold">8</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('9')">
<span class="text-2xl font-semibold">9</span>
</button>
<!-- Bottom Row: Fingerprint (Optional Placeholder) | 0 | Delete -->
<button class="h-20 w-full rounded-full flex items-center justify-center text-tertiary active:scale-90 transition-all opacity-40">
<span class="material-symbols-outlined text-3xl">fingerprint</span>
</button>
<button class="h-20 w-full rounded-full flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-highest active:scale-95 transition-all text-on-surface border border-outline-variant/10" onclick="handleInput('0')">
<span class="text-2xl font-semibold">0</span>
</button>
<button class="h-20 w-full rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-90 transition-all" onclick="handleDelete()">
<span class="material-symbols-outlined text-2xl">backspace</span>
</button>
</div>
<!-- Biometric Toggle Section -->
<div class="mt-xl w-full max-w-xs p-md bg-surface-container-low rounded-xl border border-outline-variant/10 flex items-center justify-between">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-tertiary">face</span>
<span class="font-body-md text-on-surface">Enable biometric unlock</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer-checked:bg-tertiary transition-colors toggle-bg"></div>
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5 toggle-dot"></div>
</label>
</div>
</main>
<!-- Success Modal (Hidden by default) -->
<div class="fixed inset-0 z-[100] flex items-center justify-center px-margin-mobile pointer-events-none opacity-0 transition-opacity duration-300" id="success-modal">
<div class="absolute inset-0 bg-surface/90 backdrop-blur-xl"></div>
<div class="relative glass-panel p-xl rounded-3xl border border-outline-variant/20 shadow-2xl text-center max-w-sm w-full transform scale-90 transition-transform duration-300">
<div class="w-20 h-20 bg-tertiary/20 rounded-full flex items-center justify-center mx-auto mb-lg">
<span class="material-symbols-outlined text-tertiary text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="font-headline-lg text-headline-lg text-on-surface mb-sm">PIN Secured</h3>
<p class="font-body-md text-on-surface-variant mb-xl">Your identity is now protected with military-grade encryption.</p>
<button class="w-full bg-tertiary text-on-tertiary font-title-md py-md rounded-xl active:scale-95 transition-transform shadow-lg shadow-tertiary/20">
                Enter Vault
            </button>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        let pin = "";
        const dots = document.querySelectorAll('.pin-dot');
        const container = document.getElementById('pin-indicator-container');
        const modal = document.getElementById('success-modal');

        function handleInput(num) {
            if (pin.length < 4) {
                pin += num;
                updateDots();
                
                // Add "haptic" feel with scale
                const activeDot = dots[pin.length - 1];
                activeDot.classList.add('active');

                if (pin.length === 4) {
                    validatePin();
                }
            }
        }

        function handleDelete() {
            if (pin.length > 0) {
                dots[pin.length - 1].classList.remove('active');
                pin = pin.slice(0, -1);
            }
        }

        function updateDots() {
            // Already handled in handleInput for better performance, 
            // but ensuring consistency here.
        }

        function validatePin() {
            // Simulation of validation/saving
            setTimeout(() => {
                // Success logic
                showSuccess();
            }, 400);
        }

        function showSuccess() {
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.querySelector('.relative').classList.remove('scale-90');
            modal.querySelector('.relative').classList.add('scale-100');
        }

        function triggerError() {
            container.classList.add('shake');
            setTimeout(() => {
                container.classList.remove('shake');
                pin = "";
                dots.forEach(dot => dot.classList.remove('active'));
            }, 400);
        }
    </script>
</body></html>
